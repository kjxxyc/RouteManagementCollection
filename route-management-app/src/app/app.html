<main class="rmc-layout">
  <div class="rmc-sidebar-full d-flex flex-column h-100">
    <div class="px-4 pt-3 pb-2 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <div class="rmc-logo bg-success">🔧</div>
        <span class="fs-4 fw-semibold">MASTER.</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button
          type="button"
		  class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1"
          (click)="toggleTheme()"
          aria-label="Cambiar tema"
        >
          <i class="bi" [ngClass]="isDarkTheme() ? 'bi-moon-stars' : 'bi-sun-fill'"></i>
        </button>
      </div>
    </div>

    <hr class="mx-4 my-2" />

    <ul class="nav nav-pills flex-column mb-auto px-3 gap-1">
      <li class="nav-item">
        <a class="nav-link d-flex align-items-center gap-2" href="#">
          <i class="bi bi-house-door"></i>
          <span>Inicio</span>
        </a>
      </li>
      <li>
        <a class="nav-link d-flex align-items-center gap-2" href="#">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a class="nav-link d-flex align-items-center gap-2" href="#">
          <i class="bi bi-table"></i>
          <span>Rutas</span>
        </a>
      </li>
      <li>
        <a class="nav-link d-flex align-items-center gap-2" href="#">
          <i class="bi bi-grid"></i>
          <span>Facturas</span>
        </a>
      </li>
      <li>
        <a class="nav-link d-flex align-items-center gap-2" href="#">
          <i class="bi bi-people"></i>
          <span>Pagos</span>
        </a>
      </li>
    </ul>

    <hr class="mx-4 mt-auto mb-2" />

    <div class="d-flex align-items-center px-4 pb-3 gap-2">
      <img
        src="https://avatars.githubusercontent.com/u/1?v=4"
        alt="Avatar"
        class="rounded-circle rmc-avatar"
      />
      <div class="dropdown">
        <button
          class="btn btn-sm btn-outline-light dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          Edgar Nicaragua
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#">Perfil</a></li>
          <li><a class="dropdown-item" href="#">Configuración</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
        </ul>
      </div>
    </div>
  </div>

  <section class="rmc-router flex-grow-1">
    <div class="p-3">
      <h2 class="h5 mb-3">Datos desde API /api/routes</h2>
      <p *ngIf="loading()">Cargando...</p>
      <p *ngIf="error()" class="text-danger">{{ error() }}</p>
      <pre
        *ngIf="!loading() && !error() && routes?.length"
        class="bg-body-tertiary p-2 rounded small"
      >
{{ routes | json }}
      </pre>
      <p *ngIf="!loading() && !error() && !routes?.length">Sin datos aún.</p>
    </div>
    <router-outlet />
  </section>
</main>
