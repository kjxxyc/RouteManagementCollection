<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">
            <i class="bi bi-key-fill"></i> Captura de Contraseña
          </h4>
        </div>
        <div class="card-body p-4">
          <form (ngSubmit)="onSubmit()" #passwordForm="ngForm">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label fw-bold">Seleccionar Ruta *</label>
                <select 
                  class="form-select form-select-lg" 
                  [(ngModel)]="formData().routeId"
                  name="routeId"
                  required
                  [disabled]="loading()">
                  <option [ngValue]="0">-- Seleccione una ruta --</option>
                  @for (route of routes(); track route.id) {
                    <option [ngValue]="route.id">
                      {{ route.name }} - {{ route.date | date:'short' }} - {{ route.status }}
                    </option>
                  }
                </select>
              </div>

              <div class="col-md-12">
                <label class="form-label fw-bold">Contraseña *</label>
                <input 
                  type="password" 
                  class="form-control form-control-lg" 
                  [(ngModel)]="formData().passwordValue"
                  name="passwordValue"
                  placeholder="Ingrese la contraseña"
                  required
                  minlength="4"
                  [disabled]="loading()">
                <div class="form-text">
                  <i class="bi bi-info-circle"></i> La contraseña debe tener al menos 4 caracteres
                </div>
              </div>

              <div class="col-md-12">
                <div class="d-grid gap-2">
                  <button 
                    type="submit" 
                    class="btn btn-primary btn-lg"
                    [disabled]="!passwordForm.form.valid || loading()">
                    @if (loading()) {
                      <span class="spinner-border spinner-border-sm me-2"></span>
                    }
                    <i class="bi bi-save"></i> Capturar Contraseña
                  </button>
                </div>
              </div>
            </div>
          </form>

          <div class="alert alert-info mt-4">
            <i class="bi bi-exclamation-circle"></i>
            <strong>Nota:</strong> La contraseña será asociada a la ruta seleccionada y quedará registrada en el sistema de auditoría.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
